<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dark Store Blitz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--tape:#FFE500;--ink:#000;--rush:#FF2D87;--frz:#2B4BFF;--ice:#BFE0FF;--chem:#FF9A2E;--floor:#E8E6DA;
--disp:"Avenir Next Condensed","HelveticaNeue-CondensedBlack","Roboto Condensed",sans-serif-condensed,"Arial Narrow",Impact,sans-serif;
--body:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--mono:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace}
html{-webkit-text-size-adjust:100%}
body{background:var(--tape);color:var(--ink);font:16px/1.4 var(--body);min-height:100vh;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;border-radius:0}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid var(--frz);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:800;line-height:.95;letter-spacing:-.01em}
h3{font-size:22px}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-200%);background:var(--ink);color:#fff;padding:10px 16px;border:2px solid #fff;font-weight:600;z-index:50;transition:transform .2s;max-width:90vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
.wait{padding:40vh 20px 0;text-align:center;font:800 28px var(--disp)}
.logo{font:800 76px/.8 var(--disp);text-transform:uppercase;letter-spacing:-.03em;word-spacing:100vw}
.off{background:var(--rush);color:#000;padding:2px 6px}
.hurry{color:var(--rush)!important}

.btn,.btn2{font:800 20px/1 var(--disp);padding:15px 18px;border:3px solid var(--ink)}
.btn{background:var(--ink);color:var(--tape);box-shadow:4px 4px 0 var(--rush)}
.btn2{background:#fff;box-shadow:4px 4px 0 var(--ink)}
.btn:active,.btn2:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.link{text-decoration:underline;font-weight:600;padding:6px 0}

.join{max-width:420px;margin:0 auto;padding:8vh 20px 40px;display:grid;gap:18px}
.join label{display:grid;gap:6px;font-weight:600}
.join input{border:3px solid var(--ink);background:#fff;padding:14px;font-size:20px;width:100%}

.top{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:8px 12px;font:800 18px/1 var(--disp)}
.top .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:36vw}
.top .sc{color:var(--tape);white-space:nowrap}
.top .q{margin-left:auto;border:2px solid #fff;padding:5px 9px;font-size:15px}
.top .tm{font-size:30px;color:var(--tape);font-variant-numeric:tabular-nums;min-width:2.3em;text-align:right}

.pl{max-width:560px;margin:0 auto;padding:14px 12px 120px}
.pl>*+*{margin-top:12px}
.kick{font:800 28px/1 var(--disp)}
.tip{font-size:14px}
.card{background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:16px}
.card>*+*{margin-top:8px}
.card h2{font-size:30px}
.num{font:800 64px/.9 var(--disp);font-variant-numeric:tabular-nums}
.warn{background:var(--rush)}
.alert{background:var(--rush);font-weight:700;padding:10px 12px;border:3px solid var(--ink)}
.best{border-top:2px dashed var(--ink);padding-top:8px;font-weight:600}
.pens{list-style:none}
.pens li{padding:3px 0}
.pens b{background:var(--rush);padding:0 5px}
.rules h3{margin:14px 0 4px}
.rules ul{padding-left:20px}
.rules li{margin:3px 0}

.map{display:grid;grid-template-columns:16px 1fr;grid-template-rows:16px auto;font:700 11px/1 var(--body)}
.cols{grid-column:2;grid-row:1;display:grid;grid-template-columns:repeat(10,1fr);text-align:center}
.rows{grid-column:1;grid-row:2;display:grid;grid-template-rows:repeat(10,1fr);align-items:center}
.grid{grid-column:2;grid-row:2;position:relative;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);aspect-ratio:1;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:var(--ink)}
.c{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;font:700 clamp(8px,2.4vw,13px)/1 var(--body);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);padding:0;user-select:none;-webkit-user-select:none}
.c small{font-size:.8em;font-weight:500;opacity:.45}
.c b{font:800 1.7em/1 var(--disp)}
.c i{font-style:normal;font-size:.8em;position:absolute;right:2px;bottom:1px}
.k-walk{background:var(--floor)}
.k-start{background:var(--rush)}
.k-counter{background:var(--ink);color:#fff}
.k-dock{background:#bbb;font-weight:500}
.k-closed{background:repeating-linear-gradient(45deg,#000 0 3px,#444 3px 6px)}
.k-gap{background:#444;color:#fff;font-weight:500}
.k-shelf,.k-spare{background:#fff}
.k-cold{background:var(--ice)}
.k-chem{background:#FFD9A8}
.k-shelf.full,.k-spare.full{background:var(--ink);color:var(--tape)}
.k-cold.full{background:var(--frz);color:#fff}
.k-chem.full{background:var(--chem)}
.k-walk.on{background:#C5CEFF}
.c.tgt{background:var(--rush);color:#000;animation:pulse .8s infinite alternate}
.c.got{background:#fff;color:#000;box-shadow:inset 0 0 0 3px var(--ink)}
.c.got b{text-decoration:line-through}
.c.me::after{content:"";position:absolute;width:56%;height:56%;border-radius:50%;background:var(--rush);border:2px solid var(--ink)}
.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.path polyline{fill:none;stroke:var(--frz);stroke-width:.16;stroke-linejoin:round;stroke-linecap:round}
@keyframes pulse{to{box-shadow:inset 0 0 0 4px var(--ink)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border:1.5px solid var(--ink);display:inline-block}

.plist{list-style:none;background:#fff;border:3px solid var(--ink)}
.plist li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #0002;font-size:14px}
.plist li>b{font:800 18px var(--disp);width:22px}
.plist li>span{flex:1}
.plist em{font-style:normal;font-weight:700}
.plist u{text-decoration:none;font-size:12px;opacity:.55}
.plist .in u{opacity:1;font-weight:700}
.tag{font-size:11px;font-weight:700;padding:1px 5px;border:1.5px solid var(--ink);white-space:nowrap;color:#000}
.t-cold{background:var(--ice)}.t-chemical{background:var(--chem)}.t-fragile{background:#fff}.t-heavy{background:#ddd}

.scrim{position:fixed;inset:0;background:#000a;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:86vh;display:flex;flex-direction:column;background:var(--tape);border-top:4px solid var(--ink);max-width:640px;margin:0 auto}
.sheet-head{display:flex;align-items:baseline;gap:10px;padding:12px 14px 6px}
.sheet-head h2{font-size:34px}
.x{margin-left:auto;font-size:20px;padding:4px 10px;border:3px solid var(--ink);background:#fff}
.sheet-body{overflow:auto;padding:6px 14px 14px;-webkit-overflow-scrolling:touch}
.sheet-foot{padding:10px 14px calc(14px + env(safe-area-inset-bottom));border-top:3px solid var(--ink);background:#fff}
.step{font-weight:700;margin-bottom:8px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{text-align:left;background:#fff;border:2px solid var(--ink);padding:9px 8px;font-size:14px;line-height:1.25}
.chip b{font:800 17px var(--disp)}
.chip em{display:block;font-style:normal;font-size:11px;opacity:.65}
.chip.used{background:#fff8}
.chip.sel{background:var(--ink);color:var(--tape)}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvl{font:800 20px var(--disp);padding:14px 4px;border:3px solid var(--ink);background:var(--tape)}
.lvl.sel{background:var(--ink);color:var(--tape)}
.sheet-foot .link{margin-top:10px}

.bill{background:#fff;font-family:var(--mono);padding:14px 14px 12px;position:relative}
.bill::after{content:"";position:absolute;left:0;right:0;top:100%;height:7px;background:radial-gradient(circle at 7px 0,#fff 6px,transparent 6.5px) 0 0/14px 7px repeat-x}
.bill h2{font:800 30px/1 var(--disp)}
.bill ul{list-style:none;margin-top:8px;border-top:2px dashed var(--ink)}
.bill li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #0005;font-size:15px}
.bill li.ok{text-decoration:line-through;opacity:.5}
.bill li.miss span:last-child{background:var(--rush);padding:0 4px}
.pl>.bill+*{margin-top:20px}

.tabs{display:flex;gap:6px;align-items:center}
.tab{font:800 18px var(--disp);padding:9px 12px;border:3px solid var(--ink);background:#fff}
.tab.sel{background:var(--ink);color:var(--tape)}
.tabs .link{margin-left:auto}
.opt{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:14px}
.opt b{display:block;font:800 24px var(--disp)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar .mt{margin-right:auto;font:800 18px/1 var(--disp)}
.bar .mt b{font-size:40px;color:var(--tape)}
.bar .mt small{display:block;font:500 11px var(--body);opacity:.7}
.bar .btn2{padding:12px;font-size:17px;box-shadow:none;color:#000}
.bar .btn{background:var(--tape);color:var(--ink);box-shadow:none;padding:12px 16px}

.board{list-style:none;counter-reset:r;background:#fff;border:3px solid var(--ink)}
.board li{counter-increment:r;display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid #0002}
.board li::before{content:counter(r);font:800 20px var(--disp);width:26px}
.board li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li b{font:800 22px var(--disp);font-variant-numeric:tabular-nums}
.board .you{background:var(--ink);color:var(--tape)}

.host{padding:2.2vh 3vw 9vh;min-height:100vh;display:flex;flex-direction:column;gap:2vh}
.htop{display:flex;align-items:center;gap:2vw;font:800 2vw var(--disp)}
.host .logo{font-size:2.6vw;word-spacing:normal}
.lead{font:800 2.6vw/1.05 var(--disp)}
.url{font:800 7vw/.95 var(--disp);font-variant-numeric:tabular-nums;background:var(--ink);color:var(--tape);padding:.1em .25em;display:inline-block;margin:1.2vh 0}
.split{display:grid;grid-template-columns:1.25fr 1fr;gap:3vw;align-items:start}
.bigtimer{font:800 min(30vh,20vw)/.85 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tchips{display:flex;flex-wrap:wrap;gap:.8vw}
.tchip{background:#fff;border:3px solid var(--ink);padding:.4vw .9vw;font:800 1.7vw var(--disp);box-shadow:3px 3px 0 var(--ink)}
.tchip.ok{background:var(--ink);color:var(--tape)}
.tchip button{margin-left:.5vw;font-size:1.1vw}
.acts{display:flex;flex-wrap:wrap;gap:1vw;margin-top:auto}
.host .btn,.host .btn2{font-size:1.6vw;padding:1vw 1.4vw}
.htop .btn2{margin-left:auto}
.tix{background:#fff;border:3px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:1.6vw 2vw;transform:rotate(-.6deg);align-self:flex-start;max-width:100%}
.tix h2{font-size:6vw}
.tix h3{font-size:2.6vw}
.tix p{font-size:1.5vw;margin-top:1vw;font-weight:600}
.items{list-style:none;display:flex;flex-wrap:wrap;gap:.8vw;margin-top:1vw}
.items li{font:800 2.8vw var(--disp);background:var(--tape);border:3px solid var(--ink);padding:.2vw 1vw}
.two{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:1vw}
.tb{border-collapse:collapse;background:#fff;border:3px solid var(--ink);width:100%;font-size:1.5vw}
.tb th,.tb td{text-align:left;padding:.5vw 1vw;border-bottom:1px solid #0003}
.tb th{background:var(--ink);color:#fff;font:800 1.5vw var(--disp)}
.tb .why{font-size:1.1vw}
.host h3{font-size:2.2vw;margin-bottom:.6vw}
.host .board li{font-size:1.5vw}
.sales{list-style:none;columns:4;background:#fff;border:3px solid var(--ink);padding:1vw;font-size:1.4vw}
.podium{list-style:none;counter-reset:r;display:grid;gap:.8vw}
.podium li{counter-increment:r;display:flex;align-items:baseline;gap:1.5vw;background:#fff;border:3px solid var(--ink);padding:.5vw 1.4vw;font:800 2vw var(--disp)}
.podium li::before{content:counter(r)}
.podium li span{flex:1}
.podium em{font:500 1.2vw var(--body)}
.podium li:first-child{font-size:5vw;background:var(--ink);color:var(--tape)}
.podium li:nth-child(2),.podium li:nth-child(3){font-size:3vw}
.hfoot{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:.4vw;background:var(--ink);color:#fff;padding:.6vw 3vw;font-size:1vw}
.pill{border:1.5px solid #fff;padding:.25vw .6vw;font-size:.95vw;color:#fff}
.pill.done{background:#fff;color:#000}
.pill.cur{background:var(--rush);color:#000;border-color:var(--rush)}
.hfoot .btn2{font-size:.95vw;padding:.3vw .7vw;box-shadow:none;border-width:1.5px;color:#000;margin-left:.6vw}
.sheet.wide{max-width:1100px;font-size:1.4vw}
.sheet.wide .rules{columns:2;column-gap:3vw}
.sheet.wide h3{font-size:2vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
(function () {
'use strict';
var HOST = location.pathname.replace(/\/+$/, '') === '/host';
var KEY = HOST ? 'dsb_host' : 'dsb_team';
var ROWS = 'ABCDEFGHIJ', DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
var LV = { T: 'Top', M: 'Middle', B: 'Bottom' };
var app = document.getElementById('app'), toastEl = document.getElementById('toast');
var V = null, offset = 0, last = null, seq = 0, applied = 0, offline = false, polling = false, sending = false, prevPhase = null, toastT, initialResetDone = false;
var ui = { sel: null, pick: null, rules: false, hideTimer: false };
var rt = { id: null };
var me;
try { me = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { me = {}; }
function store() { try { localStorage.setItem(KEY, JSON.stringify(me)); } catch (e) {} }

// ---------- small helpers ----------
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(s) { toastEl.textContent = s; toastEl.className = 'show'; clearTimeout(toastT); toastT = setTimeout(function () { toastEl.className = ''; }, 2800); }
function buzz() {
  try {
    var A = new (window.AudioContext || window.webkitAudioContext)(), o = A.createOscillator(), g = A.createGain();
    o.type = 'square'; o.frequency.value = 196; g.gain.value = 0.15; o.connect(g); g.connect(A.destination); o.start(); o.stop(A.currentTime + 0.8);
  } catch (e) {}
}
function pname(n) { return V.products[n - 1].name; }
function tagHtml(p) { return p.tag ? ' <span class="tag t-' + p.tag.toLowerCase() + '">' + p.tag.toLowerCase() + '</span>' : ''; }

// ---------- the map (same rules as the server) ----------
function kind(r, c) {
  if (r === 0) return c === 3 ? 'start' : c < 3 ? 'counter' : 'dock';
  if (r === 1 || r === 8) return 'walk';
  if (r === 9) return c <= 3 ? 'cold' : c <= 6 ? 'spare' : c === 7 ? 'gap' : 'chem';
  if (c === 3 || c === 6 || c === 9) return 'walk';
  if (r <= 5 && (c === 2 || c === 4 || c === 5 || c === 7 || c === 8)) return 'shelf';
  return 'closed';
}
function cid(r, c) { return ROWS.charAt(r) + c; }
function rc(s) { return [ROWS.indexOf(s.charAt(0)), +s.slice(1)]; }
function walk(r, c) { if (r < 0 || r > 9 || c < 1 || c > 10) return false; var k = kind(r, c); return k === 'walk' || k === 'start'; }
function steps(cell, oneWay) {
  var q = rc(cell), out = [];
  DIRS.forEach(function (d) {
    if (!walk(q[0] + d[0], q[1] + d[1])) return;
    if (oneWay && q[1] === 6 && d[0] === -1) return;
    out.push(cid(q[0] + d[0], q[1] + d[1]));
  });
  return out;
}
function spots(cell) {
  var q = rc(cell), out = [];
  DIRS.forEach(function (d) { if (walk(q[0] + d[0], q[1] + d[1])) out.push(cid(q[0] + d[0], q[1] + d[1])); });
  return out;
}
function where(L, p) { for (var k in L) if (L[k].p === p) return k; return null; }
function pathTo(from, to, oneWay) {
  var prev = {}, q = [from], x, ns, i, n, out;
  prev[from] = '';
  while (q.length) {
    x = q.shift(); ns = steps(x, oneWay);
    for (i = 0; i < ns.length; i++) {
      n = ns[i];
      if (prev[n] !== undefined) continue;
      prev[n] = x;
      if (n === to) { out = [to]; while (out[0] !== from) out.unshift(prev[out[0]]); return out; }
      q.push(n);
    }
  }
  return null;
}
function pickedOf(route, items, L) {
  var st = {}, out = {};
  route.forEach(function (x) { st[x] = 1; });
  items.forEach(function (p) { var w = where(L, p); if (w && spots(w).some(function (s) { return st[s]; })) out[p] = 1; });
  return out;
}
function missing(items, L) { return items.filter(function (p) { return !where(L, p); }); }
function isDone(route, items, L) {
  if (route.length < 2 || route[route.length - 1] !== 'A3') return false;
  var pk = pickedOf(route, items, L);
  return items.every(function (p) { return pk[p]; });
}
function tripsOf(R) { return !R.double ? [R.items] : rt.mode === 'B' ? [R.a.concat(R.b)] : [R.a, R.b]; }

// ---------- talking to the laptop ----------
function api(body) {
  var my = ++seq;
  if (HOST) body.hp = me.hp; else { body.tid = me.tid; if (!body.pin) body.pin = me.pin; }
  return fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (v) {
      offline = false;
      if (my < applied) return v;
      applied = my;
      if (v.gone || v.badPin) { me = {}; store(); V = null; prevPhase = null; }
      else if (v.ok && v.phase) {
        V = v; offset = v.now - Date.now();
        if (!initialResetDone && !HOST && v.phase === 'order' && v.mine) {
          initialResetDone = true;
          api({ a: 'replay' });
          return v;
        }
        initialResetDone = true;
        phaseChanged();
      }
      if (v.err) toast(v.err);
      render();
      return v;
    }, function () { offline = true; render(); return { ok: false }; });
}
function phaseChanged() {
  if (V.phase === prevPhase) return;
  if (prevPhase && HOST && (V.phase === 'reveal' || V.phase === 'locked')) buzz();
  if (prevPhase && !HOST && V.phase === 'order' && navigator.vibrate) navigator.vibrate(200);
  if (V.phase !== 'layout') ui.sel = null;
  prevPhase = V.phase;
}
function poll() {
  if (polling || !(HOST ? me.hp : me.tid)) return;
  polling = true;
  var done = function () { polling = false; };
  api({ a: HOST ? 'hstate' : 'state' }).then(done, done);
}
function left() { return V && V.endsAt ? Math.max(0, V.endsAt - (Date.now() + offset)) : 0; }
function tickTimers() {
  var els = document.querySelectorAll('[data-timer]'), ms = left(), s = Math.ceil(ms / 1000), i;
  var txt = (V && V.noTimer) ? 'DEMO' : Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  for (i = 0; i < els.length; i++) {
    if (V && V.noTimer) {
      els[i].textContent = 'DEMO';
      els[i].classList.remove('hurry');
    } else {
      els[i].textContent = txt;
      els[i].classList.toggle('hurry', ms < 30000);
    }
  }
}
function render() {
  var h = HOST ? hostHtml() : playerHtml();
  if (h !== last) {
    var sb = document.querySelector('.sheet-body'), st = sb ? sb.scrollTop : 0;
    app.innerHTML = h; last = h;
    sb = document.querySelector('.sheet-body'); if (sb) sb.scrollTop = st;
  }
  tickTimers();
}

// ---------- shared pieces ----------
function mapHtml(o) {
  var L = o.layout, need = {}, got = {}, on = {}, cur = null, h = '', r, c, i;
  (o.items || []).forEach(function (p) { var w = where(L, p); if (w) { need[w] = 1; if (o.picked[p]) got[w] = 1; } });
  if (o.route) { o.route.forEach(function (x) { on[x] = 1; }); cur = o.route[o.route.length - 1]; }
  for (r = 0; r < 10; r++) for (c = 1; c <= 10; c++) {
